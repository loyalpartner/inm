[package]
name = "inm"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
glib = "0.22.8"
gpui = "0.2.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = "0.25.10"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smallvec = "1.15.2"
spice-client-glib = { version = "0.8.0", features = ["v0_42"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.26"
